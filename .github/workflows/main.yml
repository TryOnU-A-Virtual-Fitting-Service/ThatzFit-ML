name: Deploy thatzfit-ml to EC2

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 워크플로우 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 3. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker 이미지 빌드 및 ECR에 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: attentionplease/thatzfit-ml # ECR 리포지토리 이름 
          IMAGE_TAG: ${{ github.sha }}-run-${{ github.run_id }}
        run: |
          aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin 538189757945.dkr.ecr.ap-northeast-2.amazonaws.com
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5. EC2에 접속하여 배포 스크립트 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ML_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.ML_EC2_PRIVATE_KEY }}
          script: |
            docker stop thatzfit-ml-container
            docker rm thatzfit-ml-container
            docker pull ${{ steps.build-image.outputs.image }}
            docker run -d --name thatzfit-ml-container -p 8000:8000 --restart always ${{ steps.build-image.outputs.image }}
            
  notify-slack:
    # build-and-deploy job이 끝난 후에 실행되도록 설정
    needs: build-and-deploy
    runs-on: ubuntu-latest
    # build-and-deploy job의 성공/실패 여부와 상관없이 항상 실행
    if: always()

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          status: ${{ needs.build-and-deploy.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

